<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Star Number Generator</title><style>
:root{--navy:#000C5C;--blue:#019DFF;--blue2:#33b4ff;--yellow:#FFEA04;--pink:#FC629E;--bg:#00082E;--s:#060d3a;--s2:#0a1448}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
header{background:var(--navy);border-bottom:3px solid var(--yellow);display:flex;align-items:center;gap:4vw;padding:1.2vh 4vw;height:19vh}
#logo{height:88%;cursor:pointer;transition:transform .12s}#logo:hover{transform:scale(1.04)}#logo:active{transform:scale(.96)}
h1{font-size:5.4vh;letter-spacing:.1em}.sub{color:var(--pink);font-size:2.4vh}
main{display:flex;gap:3vw;padding:3vh 4vw;height:81vh}
.card{flex:1;background:var(--s);border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--yellow);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card h2{background:var(--navy);color:var(--yellow);font-size:2.1vh;letter-spacing:.12em;padding:1vh 1.4vw}
.body{flex:1;padding:2vh 2vw;display:flex;flex-direction:column;align-items:center;gap:1.6vh;min-height:0}
#max{width:100%;background:var(--s2);border:1.5px solid var(--blue);border-radius:8px;font:800 7vh Consolas,monospace;text-align:center;padding:.4vh}
#range{color:var(--pink);font-weight:700;font-size:2vh;letter-spacing:.06em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vh 1vw;width:100%;flex:1;min-height:0}
button{font:700 3.6vh "Segoe UI";background:var(--s2);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--blue2)}button:active{transform:scale(.96)}button.p{color:var(--pink)}
#res{font:800 24vh/1 Consolas,monospace;color:var(--yellow);text-shadow:0 0 30px rgba(255,234,4,.35);flex:1;display:flex;align-items:center}
#hist{color:#7F86A8;font:700 2.2vh Consolas,monospace;min-height:3vh}
#gen{width:100%;height:11vh;background:var(--blue);border-color:var(--blue);color:#001030;font-weight:800;font-size:4.4vh;letter-spacing:.14em}
#gen:hover{background:var(--blue2)}#msg{color:var(--yellow);min-height:3vh;font-size:2.2vh}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
#stars img{position:absolute;opacity:0;will-change:transform,opacity}
@keyframes starfly{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.35)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--spin)) scale(var(--e))}}
</style></head><body>
